
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SECURTAP | Email Confirmation</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px 28px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(15, 23, 42, .08);
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #2563eb;
    }

    .icon {
      margin: 24px auto 16px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #dbeafe;
      color: #2563eb;
      display: grid;
      place-items: center;
      font-size: 32px;
    }

    h1 { font-size: 25px; margin-bottom: 12px; }
    p { color: #64748b; line-height: 1.6; }

    .button {
      display: block;
      margin-top: 24px;
      padding: 14px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .status { font-size: 14px; margin-top: 18px; }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">SECURTAP</div>
    <div class="icon" id="icon">...</div>
    <h1 id="heading">Confirming your email</h1>
    <p id="message">
      Please wait while we verify your email confirmation.
    </p>
    <p class="status" id="status"></p>
    <a class="button" id="action" href="#" hidden>Continue</a>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false
        }
      }
    );

    const heading = document.getElementById("heading");
    const message = document.getElementById("message");
    const icon = document.getElementById("icon");
    const status = document.getElementById("status");
    const action = document.getElementById("action");

    function showError(text) {
      icon.textContent = "!";
      heading.textContent = "Confirmation unsuccessful";
      message.textContent = text;
      status.textContent =
        "Try opening the confirmation link from your email again.";
    }

    async function confirmEmail() {
      try {
        const params = new URLSearchParams(
          window.location.search
        );

        const hash = new URLSearchParams(
          window.location.hash.slice(1)
        );

        // Support Supabase PKCE redirects if a code is provided.
        const code = params.get("code");

        if (code) {
          const { error } =
            await supabase.auth.exchangeCodeForSession(code);

          if (error) throw error;
        } else {
          // Supabase's email link may return a session in the URL hash.
          const accessToken = hash.get("access_token");
          const refreshToken = hash.get("refresh_token");
          const type = hash.get("type");

          if (accessToken && refreshToken) {
            const { error } = await supabase.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });

            if (error) throw error;
          } else if (params.get("error")) {
            throw new Error(
              params.get("error_description") ||
              params.get("error")
            );
          } else {
            // A clean visit does not prove that confirmation succeeded.
            throw new Error(
              "No confirmation session was received. Open the original confirmation email link."
            );
          }
        }

        // Clear authentication values from the visible address bar.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

        icon.textContent = "✓";
        heading.textContent = "Email confirmed!";
        message.textContent =
          "Your SECURTAP email address has been confirmed successfully. You can now return to the app and sign in.";
        status.textContent = "Your account confirmation is complete.";

        action.textContent = "Return to SECURTAP";
        action.href = "https://YOUR-GITHUB-USERNAME.github.io/securtap-confirmation/";
        action.hidden = false;
      } catch (error) {
        console.error("Email confirmation error:", error);
        showError(
          error.message ||
          "We could not verify your email. The link may have expired or already been used."
        );
      }
    }

    confirmEmail();
  </script>
</body>
</html>
