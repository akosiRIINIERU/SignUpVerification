<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Client | Account Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px 28px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #2563eb;
    }

    .icon {
      margin: 24px auto 16px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #dbeafe;
      color: #2563eb;
      display: grid;
      place-items: center;
      font-size: 32px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    p {
      color: #64748b;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      text-align: left;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }


    .button {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }


    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      font-size: 14px;
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #b91c1c;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">RANDOM CLIENT</div>

    <div class="icon" id="icon">✉</div>

    <h1 id="heading">Verify your email</h1>

    <p id="message">
Open the secure link sent to your email to confirm your account or reset your password.
    </p>

    <!-- Displayed after successful verification -->
    <a
      class="button"
      id="action"
      href="https://akosiriinieru.github.io/SignUpVerification/"
      hidden
    >
      Return to Random Client
    </a>

    <!-- Shown only when Supabase returns a password-recovery session. -->
    <form id="recoveryForm" hidden>
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required />
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Re-enter your password" required />
      <button class="button" id="updatePasswordButton" type="submit">Update password</button>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Replace these with your actual Supabase project values.
    const SUPABASE_URL =
      "https://ckpnxithvgkctnaqdtwh.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcG54aXRodmdrY3RuYXFkdHdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTU5NDEsImV4cCI6MjEwNTczMTk0MX0.bhr0yDMo_czxAEFZhLbNc7PC7p94bxHQW79DFIBIQ0w";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false
        }
      }
    );

    const heading = document.getElementById("heading");
    const message = document.getElementById("message");
    const icon = document.getElementById("icon");
    const status = document.getElementById("status");
    const action = document.getElementById("action");
    const recoveryForm = document.getElementById("recoveryForm");
    const updatePasswordButton = document.getElementById("updatePasswordButton");

    function showStatus(text, success = false) {
      status.textContent = text;
      status.className = success ? "status success" : "status error";
    }

    function showLinkError(text) {
      icon.textContent = "!";
      heading.textContent = "This link could not be used";
      message.textContent = "The link may have expired or already been used. Request a new email and open its latest link.";
      recoveryForm.hidden = true;
      action.hidden = true;
      showStatus(text || "Please request a new email link.");
    }

    function showSuccess(text) {
      icon.textContent = "✓";
      heading.textContent = "Email confirmed!";
      message.textContent = text;
      action.hidden = false;
      showStatus("Your email confirmation is complete.", true);
    }

    function clearAuthUrl() {
      // Remove query/hash values that may contain authentication data.
      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );
    }

    function showRecoveryForm() {
      icon.textContent = "🔐";
      heading.textContent = "Choose a new password";
      message.textContent = "Enter and confirm your new password below. Use at least 8 characters.";
      action.hidden = true;
      recoveryForm.hidden = false;
      status.textContent = "";
      recoveryForm.dataset.ready = "true";
    }

    async function confirmEmailLink() {
      const params = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const code = params.get("code");
      const type = hash.get("type") || params.get("type");
      const urlError = hash.get("error_description") || params.get("error_description") || hash.get("error") || params.get("error");

      if (urlError) {
        showLinkError(urlError);
        return;
      }

      try {
        // Supabase's implicit-flow recovery link includes type=recovery in the URL hash.
        // Establish that session before allowing a password change.
        if (type === "recovery") {
          const accessToken = hash.get("access_token");
          const refreshToken = hash.get("refresh_token");

          if (accessToken && refreshToken) {
            const { error } = await supabase.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });
            if (error) throw error;
          } else if (code) {
            const { error } = await supabase.auth.exchangeCodeForSession(code);
            if (error) throw error;
          } else {
            throw new Error("This password-reset link is incomplete. Please request a new one.");
          }

          const { data, error } = await supabase.auth.getSession();
          if (error) throw error;
          if (!data.session) throw new Error("The password-reset session could not be established. Please request a new link.");

          clearAuthUrl();
          showRecoveryForm();
          return;
        }

        if (code) {
          const { error } = await supabase.auth.exchangeCodeForSession(code);
          if (error) throw error;
          clearAuthUrl();
          showSuccess("Your email has been confirmed. You can now return to the app and sign in.");
          return;
        }

        const accessToken = hash.get("access_token");
        const refreshToken = hash.get("refresh_token");
        if (accessToken && refreshToken) {
          const { error } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (error) throw error;
          clearAuthUrl();
          showSuccess("Your email has been confirmed. You can now return to the app and sign in.");
          return;
        }

        icon.textContent = "✉";
        heading.textContent = "Check your email";
        message.textContent = "Open the secure confirmation or password-reset link sent to your email. If the link has expired, request a new one from the app.";
        recoveryForm.hidden = true;
      } catch (error) {
        console.error("Authentication link error:", error);
        showLinkError(error.message || "Unable to process this link. Please request a new email.");
      }
    }

    recoveryForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (recoveryForm.dataset.ready !== "true") return;

      const password = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;
      if (password.length < 8) {
        showStatus("Use a password with at least 8 characters.");
        return;
      }
      if (password !== confirmation) {
        showStatus("The passwords do not match.");
        return;
      }

      updatePasswordButton.disabled = true;
      updatePasswordButton.textContent = "Updating password...";
      try {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;
        recoveryForm.hidden = true;
        heading.textContent = "Password updated";
        message.textContent = "Your password has been changed successfully. Return to the app and sign in with your new password.";
        icon.textContent = "✓";
        showStatus("Password reset completed successfully.", true);
        clearAuthUrl();
      } catch (error) {
        console.error("Password update error:", error);
        showStatus(error.message || "Could not update the password. Please try again.");
      } finally {
        updatePasswordButton.disabled = false;
        updatePasswordButton.textContent = "Update password";
      }
    });

    // Email-link authentication is used instead of manual OTP entry.

    // Prefill email if supplied as ?email=user@example.com.
    const initialParams = new URLSearchParams(window.location.search);
    const emailFromUrl = initialParams.get("email");

    // Process a confirmation or recovery link. Ordinary visits show a helpful link-based message.
    confirmEmailLink();
  </script>
</body>
</html>
