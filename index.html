<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SECURTAP | Email Confirmation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px 28px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #2563eb;
    }

    .icon {
      margin: 24px auto 16px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #dbeafe;
      color: #2563eb;
      display: grid;
      place-items: center;
      font-size: 32px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    p {
      color: #64748b;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      text-align: left;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    #otp {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 8px;
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .button.secondary {
      background: #e2e8f0;
      color: #1e293b;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      font-size: 14px;
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #b91c1c;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">SECURTAP</div>

    <div class="icon" id="icon">✉</div>

    <h1 id="heading">Verify your email</h1>

    <p id="message">
      Enter the six-digit verification code sent to your email.
      You can also open the confirmation link from your email.
    </p>

    <!-- OTP verification form -->
    <form id="otpForm">
      <div id="otpSection">
        <label for="email">Email address</label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />

        <label for="otp">Six-digit verification code</label>

        <input
          id="otp"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          placeholder="000000"
          maxlength="6"
          pattern="[0-9]{6}"
          required
        />

        <button class="button" id="verifyButton" type="submit">
          Verify Email
        </button>
      </div>
    </form>

    <button
      class="button secondary"
      id="resendButton"
      type="button"
    >
      Resend Code
    </button>

    <!-- Displayed after successful verification -->
    <a
      class="button"
      id="action"
      href="https://akosiriinieru.github.io/SignUpVerification/"
      hidden
    >
      Return to SECURTAP
    </a>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Replace these with your actual Supabase project values.
    const SUPABASE_URL =
      "https://ckpnxithvgkctnaqdtwh.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcG54aXRodmdrY3RuYXFkdHdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTU5NDEsImV4cCI6MjEwNTczMTk0MX0.bhr0yDMo_czxAEFZhLbNc7PC7p94bxHQW79DFIBIQ0w";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false
        }
      }
    );

    const heading = document.getElementById("heading");
    const message = document.getElementById("message");
    const icon = document.getElementById("icon");
    const status = document.getElementById("status");
    const otpSection = document.getElementById("otpSection");
    const otpForm = document.getElementById("otpForm");
    const emailInput = document.getElementById("email");
    const otpInput = document.getElementById("otp");
    const verifyButton = document.getElementById("verifyButton");
    const resendButton = document.getElementById("resendButton");
    const action = document.getElementById("action");

    function showStatus(text, success = false) {
      status.textContent = text;
      status.className = success ? "status success" : "status error";
    }

    function showOtpForm(text = "") {
      icon.textContent = "✉";
      heading.textContent = "Verify your email";
      message.textContent =
        "Enter the six-digit verification code sent to your email.";
      otpSection.hidden = false;
      resendButton.hidden = false;
      action.hidden = true;

      if (text) {
        showStatus(text);
      }
    }

    function showSuccess(text) {
      icon.textContent = "✓";
      heading.textContent = "Email confirmed!";
      message.textContent = text;
      otpSection.hidden = true;
      resendButton.hidden = true;
      action.hidden = false;
      showStatus("Your email confirmation is complete.", true);
    }

    function clearAuthUrl() {
      // Remove query/hash values that may contain authentication data.
      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );
    }

    async function confirmEmailLink() {
      const params = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(
        window.location.hash.slice(1)
      );

      const code = params.get("code");
      const urlError =
        params.get("error_description") || params.get("error");

      // If Supabase reports a link error, offer OTP verification instead.
      if (urlError) {
        showOtpForm(urlError);
        return;
      }

      try {
        if (code) {
          // PKCE confirmation link
          const { error } =
            await supabase.auth.exchangeCodeForSession(code);

          if (error) {
            showOtpForm(error.message);
            return;
          }

          clearAuthUrl();

          showSuccess(
            "Your SECURTAP email address has been confirmed. You can now return to the app and sign in."
          );
          return;
        }

        const accessToken = hash.get("access_token");
        const refreshToken = hash.get("refresh_token");
        const type = hash.get("type");

        if (accessToken && refreshToken) {
          // Legacy confirmation link returning a session in the URL.
          const { error } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });

          if (error) {
            showOtpForm(error.message);
            return;
          }

          clearAuthUrl();

          showSuccess(
            "Your SECURTAP email address has been confirmed. You can now return to the app and sign in."
          );
          return;
        }

        // A normal visit should show the OTP form.
        showOtpForm();
      } catch (error) {
        console.error("Confirmation link error:", error);
        showOtpForm(
          error.message || "Unable to process the confirmation link."
        );
      }
    }

    // Verify a six-digit signup OTP.
    otpForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const token = otpInput.value.trim();

      if (!email) {
        showStatus("Please enter your email address.");
        return;
      }

      if (!/^\d{6}$/.test(token)) {
        showStatus("Please enter a valid six-digit code.");
        return;
      }

      verifyButton.disabled = true;
      verifyButton.textContent = "Verifying...";
      showStatus("");

      try {
        const { error } = await supabase.auth.verifyOtp({
          email,
          token,
          type: "signup"
        });

        if (error) {
          showStatus(
            error.message ||
            "Verification failed. Check your code and try again."
          );
          return;
        }

        clearAuthUrl();

        otpInput.value = "";

        showSuccess(
          "Your SECURTAP email address has been confirmed. You can now return to the app and sign in."
        );
      } catch (error) {
        console.error("OTP verification error:", error);
        showStatus(
          error.message ||
          "Unable to verify your code. Please try again."
        );
      } finally {
        verifyButton.disabled = false;
        verifyButton.textContent = "Verify Email";
      }
    });

    // Resend the signup confirmation email.
    resendButton.addEventListener("click", async () => {
      const email = emailInput.value.trim();

      if (!email) {
        showStatus("Enter your email address first.");
        emailInput.focus();
        return;
      }

      resendButton.disabled = true;
      resendButton.textContent = "Sending...";

      try {
        const { error } = await supabase.auth.resend({
          type: "signup",
          email
        });

        if (error) {
          showStatus(error.message);
        } else {
          showStatus(
            "If a confirmation email is available, a new code will be sent. Check your inbox and spam folder.",
            true
          );
        }
      } catch (error) {
        console.error("Resend error:", error);
        showStatus("Unable to resend the code. Please try again.");
      } finally {
        resendButton.disabled = false;
        resendButton.textContent = "Resend Code";
      }
    });

    // Prefill email if supplied as ?email=user@example.com.
    const initialParams = new URLSearchParams(window.location.search);
    const emailFromUrl = initialParams.get("email");

    if (emailFromUrl && emailFromUrl.length <= 254) {
      emailInput.value = emailFromUrl;
    }

    // Process an existing confirmation link, or show the OTP form.
    confirmEmailLink();
  </script>
</body>
</html>
