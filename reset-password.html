
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SECURTAP | Reset Password</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px 28px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(15, 23, 42, .08);
    }

    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #2563eb;
    }

    h1 { text-align: center; margin-top: 28px; }
    p { color: #64748b; line-height: 1.6; }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }
    #status { margin-top: 18px; font-size: 14px; }
    .success { color: #15803d !important; }
    .error { color: #b91c1c !important; }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">SECURTAP</div>
    <h1 id="heading">Reset your password</h1>
    <p id="message">
      Please wait while we validate your password reset link.
    </p>

    <form id="resetForm" hidden>
      <label for="password">New password</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter your new password"
        required
      />

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Re-enter your new password"
        required
      />

      <button id="submitButton" type="submit">
        Update password
      </button>
    </form>

    <p id="status" role="status"></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://ckpnxithvgkctnaqdtwh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcG54aXRodmdrY3RuYXFkdHdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTU5NDEsImV4cCI6MjEwNTczMTk0MX0.bhr0yDMo_czxAEFZhLbNc7PC7p94bxHQW79DFIBIQ0w";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false
        }
      }
    );

    const form = document.getElementById("resetForm");
    const heading = document.getElementById("heading");
    const message = document.getElementById("message");
    const status = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    let recoveryReady = false;

    function showError(text) {
      heading.textContent = "Unable to reset password";
      message.textContent =
        "Your reset link could not be validated.";
      status.textContent = text;
      status.className = "error";
      form.hidden = true;
    }

    async function prepareRecovery() {
      try {
        const params = new URLSearchParams(
          window.location.search
        );

        const hash = new URLSearchParams(
          window.location.hash.slice(1)
        );

        // Handle PKCE-style redirects.
        const code = params.get("code");

        if (code) {
          const { error } =
            await supabase.auth.exchangeCodeForSession(code);

          if (error) throw error;
        } else {
          const errorDescription =
            hash.get("error_description") ||
            params.get("error_description");

          if (errorDescription) {
            throw new Error(errorDescription);
          }

          const accessToken = hash.get("access_token");
          const refreshToken = hash.get("refresh_token");
          const type = hash.get("type");

          if (type !== "recovery" || !accessToken || !refreshToken) {
            throw new Error(
              "The recovery link is missing or expired. Request a new password reset email."
            );
          }

          const { error } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });

          if (error) throw error;
        }

        const { data, error } = await supabase.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          throw new Error(
            "No recovery session was established. Request a new reset email."
          );
        }

        // Remove recovery credentials from the visible URL.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

        recoveryReady = true;
        heading.textContent = "Choose a new password";
        message.textContent =
          "Enter your new password below. Use at least 8 characters.";
        status.textContent = "";
        form.hidden = false;
      } catch (error) {
        console.error("Password recovery error:", error);
        showError(
          error.message ||
          "The reset link is invalid or has expired."
        );
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoveryReady) {
        showError("Your recovery session is not ready. Request a new reset link.");
        return;
      }

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        status.textContent =
          "Your password must contain at least 8 characters.";
        status.className = "error";
        return;
      }

      if (password !== confirmPassword) {
        status.textContent = "The passwords do not match.";
        status.className = "error";
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Updating...";
      status.textContent = "";

      try {
        const { error } = await supabase.auth.updateUser({
          password
        });

        if (error) throw error;

        form.hidden = true;
        heading.textContent = "Password updated!";
        message.textContent =
          "Your SECURTAP password has been changed successfully. You can now sign in using your new password.";
        status.textContent = "Password reset completed.";
        status.className = "success";
      } catch (error) {
        console.error("Update password error:", error);
        status.textContent =
          error.message || "Could not update your password.";
        status.className = "error";
        submitButton.disabled = false;
        submitButton.textContent = "Update password";
      }
    });

    prepareRecovery();
  </script>
</body>
</html>
